<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestão de Imóveis</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4">

    <h1 class="mb-4">Gestão de Imóveis</h1>

    <!-- Mensagens (sucesso / erro), vindas dos flash attributes ou do próprio controller -->
    <div th:if="${sucesso}" class="alert alert-success" role="alert" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" role="alert">
        <span th:text="${erro}"></span>
        <ul class="mb-0 mt-2" th:if="${detalhes != null and !detalhes.isEmpty()}">
            <li th:each="d : ${detalhes}" th:text="${d}"></li>
        </ul>
    </div>

    <!-- Formulário de cadastro -->
    <div class="card mb-4">
        <div class="card-header">Cadastrar imóvel</div>
        <div class="card-body">
            <form th:action="@{/imoveis}" th:object="${imovel}" method="post" class="row g-3">
                <div class="col-md-6">
                    <label for="descricao" class="form-label">Descrição</label>
                    <input type="text" id="descricao" class="form-control" th:field="*{descricao}">
                </div>
                <div class="col-md-6">
                    <label for="endereco" class="form-label">Endereço</label>
                    <input type="text" id="endereco" class="form-control" th:field="*{endereco}">
                </div>
                <div class="col-md-4">
                    <label for="tipo" class="form-label">Tipo</label>
                    <select id="tipo" class="form-select" th:field="*{tipo}">
                        <option value="">Selecione...</option>
                        <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="valor" class="form-label">Valor (R$)</label>
                    <input type="number" step="0.01" id="valor" class="form-control" th:field="*{valor}">
                </div>
                <div class="col-md-4 d-flex align-items-end">
                    <div class="form-check">
                        <input type="checkbox" id="disponivel" class="form-check-input" th:field="*{disponivel}">
                        <label for="disponivel" class="form-check-label">Disponível</label>
                    </div>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabela de imóveis -->
    <div class="card">
        <div class="card-header">Imóveis cadastrados</div>
        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Descrição</th>
                    <th>Endereço</th>
                    <th>Tipo</th>
                    <th class="text-end">Valor</th>
                    <th>Disponível</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="i : ${imoveis}">
                    <td th:text="${i.id}"></td>
                    <td th:text="${i.descricao}"></td>
                    <td th:text="${i.endereco}"></td>
                    <td th:text="${i.tipo}"></td>
                    <td class="text-end"
                        th:text="${'R$ ' + #numbers.formatDecimal(i.valor, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td>
                        <span th:if="${i.disponivel}" class="badge text-bg-success">Sim</span>
                        <span th:unless="${i.disponivel}" class="badge text-bg-secondary">Não</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(imoveis)}">
                    <td colspan="6" class="text-center text-muted py-3">Nenhum imóvel para exibir.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
